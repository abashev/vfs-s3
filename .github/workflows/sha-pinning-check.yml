name: Ensure SHA-pinned actions

on:
  pull_request:
    branches: [ '17.0' ]
  push:
    branches: [ '17.0' ]

jobs:
  pin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: zgosalvez/github-actions-ensure-sha-pinned-actions@475903b3f3e9f7659fccdd1400c1f6c1dc37d7b0 # v1
