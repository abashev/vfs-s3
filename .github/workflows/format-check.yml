name: Palantir Java Format Check

on:
  pull_request:
    branches: [ '17.0' ]
  push:
    branches: [ '17.0' ]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: abashev/palantir-java-format-action@f33b0208c70db5f8ab33dff446d9e107115098f2 # v1
        with:
          version: '2.89.0'
          mode: 'all'
