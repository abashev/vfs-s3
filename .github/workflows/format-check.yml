name: Open Java Format Check

on:
  pull_request:
    branches: [ '17.0' ]
  push:
    branches: [ '17.0' ]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Exclusions live in .open-java-format-exclude at the repo root — the action and
      # .githooks/pre-commit both read that file, so there is nothing to configure here.
      - uses: openjavaformat/open-java-format-action@25979c34db6868d68055ed40456860345cf72d4d # v3
        with:
          version: '2.98.0.3'
          mode: 'all'
