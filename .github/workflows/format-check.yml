name: Palantir Java Format Check

on:
  pull_request:
    branches: [ '17.0' ]
  push:
    branches: [ '17.0' ]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: abashev/palantir-java-format-action@f33b0208c70db5f8ab33dff446d9e107115098f2 # v1
        with:
          version: '2.89.0'
          mode: 'all'
