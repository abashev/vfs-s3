name: Open Java Format Check

on:
  pull_request:
    branches: [ '17.0' ]
  push:
    branches: [ '17.0' ]

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # the code scanning upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Exclusions live in .open-java-format-exclude at the repo root — the action and
      # .githooks/pre-commit both read that file, so there is nothing to configure here.
      - uses: openjavaformat/open-java-format-action@47d995198ae0cd7dfa0e532caa436cf4e22b6500 # v4
        with:
          version: '2.98.0.6'
          mode: 'all'
          code-scanning: true
