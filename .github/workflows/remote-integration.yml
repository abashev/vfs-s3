name: Remote integration tests (manual)

# On-demand remote suites against the real AWS / Yandex environments. This is deliberately
# separate from main-build.yml, whose push-to-17.0 remote jobs are unchanged — use this to run
# the remote suites for a feature branch (pick the branch in the "Run workflow" dialog) without
# pushing to 17.0. Runs both modules across every environment at once; there is nothing to choose.
#
# NOTE: the "Run workflow" button appears in the Actions tab only once this file is present on the
# repository's DEFAULT branch (currently branch-2.4.x). Until then it exists but isn't dispatchable
# from the UI.
on:
  workflow_dispatch:

permissions:
  checks: write
  contents: read

jobs:
  commons-vfs-remote-suites:
    name: commons-vfs remote — ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [ AWS-1, YANDEX-1, YANDEX-2 ]
    environment: ${{ matrix.environment }}
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          java-version: 17
          distribution: 'liberica'
          cache: 'gradle'

      # Deterministic per-commit, per-environment, per-module bucket token (lowercase — S3 names
      # must be) shared by the test run and the cleanup step, so cleanup can target the exact
      # bucket even if the test JVM died before its own @AfterSuite teardown ran. The environment
      # suffix keeps matrix jobs sharing a BASE_URL from colliding; the module suffix keeps this
      # job's bucket distinct from jdk-remote-suites', which runs in parallel.
      - name: Compute bucket token
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: echo "BUCKET_TOKEN=${GITHUB_SHA::12}-${ENVIRONMENT,,}-commonsvfs" >> "$GITHUB_ENV"

      - name: Run EnvironmentBasedSuite against ${{ matrix.environment }}
        run: ./gradlew :modules:commons-vfs:integrationTest --tests "com.github.vfss3.commonsvfs.remote.EnvironmentBasedSuite"

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: ${{ !cancelled() }}
        with:
          report_paths: '**/build/test-results/integrationTest/*.xml'
          annotate_only: true
          job_summary: true

      # Runs regardless of test outcome — deletes the per-commit bucket (BASE_URL + BUCKET_TOKEN)
      # so failed/killed runs don't leak buckets on the remote backend.
      - name: Drop remote test bucket
        if: always()
        run: ./gradlew :modules:commons-vfs:dropRemoteBucket

  jdk-remote-suites:
    name: JDK module remote — ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [ AWS-1, YANDEX-1, YANDEX-2 ]
    environment: ${{ matrix.environment }}
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          java-version: 17
          distribution: 'liberica'
          cache: 'gradle'

      # See commons-vfs-remote-suites' identical step above — distinct "-jdk" suffix so the two
      # modules' remote suites never collide on one bucket name even though they share the same
      # BASE_URL/environment and run in parallel.
      - name: Compute bucket token
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: echo "BUCKET_TOKEN=${GITHUB_SHA::12}-${ENVIRONMENT,,}-jdk" >> "$GITHUB_ENV"

      - name: Run EnvironmentBasedSuite against ${{ matrix.environment }}
        run: ./gradlew :modules:jdk:integrationTest --tests "com.github.vfss3.jdk.remote.EnvironmentBasedSuite"

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: ${{ !cancelled() }}
        with:
          report_paths: '**/build/test-results/integrationTest/*.xml'
          annotate_only: true
          job_summary: true

      # Runs regardless of test outcome — deletes the per-commit bucket (BASE_URL + BUCKET_TOKEN)
      # so failed/killed runs don't leak buckets on the remote backend.
      - name: Drop remote test bucket
        if: always()
        run: ./gradlew :modules:jdk:dropRemoteBucket
