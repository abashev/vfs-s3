name: PR build

on:
  pull_request:
    branches: [ '17.0' ]

permissions:
  checks: write
  pull-requests: write
  contents: read

jobs:
  build:
    name: Compile + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 17
          distribution: 'liberica'
          cache: 'gradle'

      - name: Build + unit tests + coverage
        run: ./gradlew check jacocoTestReport -x integrationTest

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        if: ${{ !cancelled() }}
        with:
          report_paths: '**/build/test-results/test/*.xml'
          annotate_only: true
          job_summary: true

      - name: JaCoCo Report by Vilmos
        uses: vilmosnagy/jacoco-report@4982e687fa89217b469696f8633358606c4f3172 # 1.8.0
        if: ${{ !cancelled() }}
        with:
          paths: >-
            ${{ github.workspace }}/modules/commons-vfs/build/reports/jacoco/test/jacocoTestReport.xml,
            ${{ github.workspace }}/modules/jdk/build/reports/jacoco/test/jacocoTestReport.xml,
            ${{ github.workspace }}/modules/spring/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 40
          min-coverage-changed-files: 60
          title: Code Coverage
          comment-type: pr_comment
          update-comment: true

  commons-vfs-local-suites:
    name: commons-vfs local suite — ${{ matrix.suite }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - CephSuite
          - LocalStackSuite
          - MinioSuite
          - CloudServerSuite
          - SeaweedFsSuite
          - MiniStackSuite
          - FlociSuite
          - S3MockSuite
          - GarageSuite
          - RustFsSuite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 17
          distribution: 'liberica'
          cache: 'gradle'

      - name: Run ${{ matrix.suite }}
        run: ./gradlew :modules:commons-vfs:integrationTest --tests "com.github.vfss3.commonsvfs.local.${{ matrix.suite }}"

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        if: ${{ !cancelled() }}
        with:
          report_paths: '**/build/test-results/integrationTest/*.xml'
          annotate_only: true
          job_summary: true

  jdk-local-suites:
    name: JDK module local suite — ${{ matrix.suite }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - CephSuite
          - LocalStackSuite
          - MinioSuite
          - CloudServerSuite
          - SeaweedFsSuite
          - MiniStackSuite
          - FlociSuite
          - S3MockSuite
          - GarageSuite
          - RustFsSuite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 17
          distribution: 'liberica'
          cache: 'gradle'

      - name: Run ${{ matrix.suite }}
        run: ./gradlew :modules:jdk:integrationTest --tests "com.github.vfss3.jdk.local.${{ matrix.suite }}"

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        if: ${{ !cancelled() }}
        with:
          report_paths: '**/build/test-results/integrationTest/*.xml'
          annotate_only: true
          job_summary: true

  spring-local-suites:
    name: Spring module local suite — ${{ matrix.suite }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - CephSuite
          - LocalStackSuite
          - MinioSuite
          - CloudServerSuite
          - SeaweedFsSuite
          - MiniStackSuite
          - FlociSuite
          - S3MockSuite
          - GarageSuite
          - RustFsSuite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 17
          distribution: 'liberica'
          cache: 'gradle'

      - name: Run ${{ matrix.suite }}
        run: ./gradlew :modules:spring:integrationTest --tests "com.github.vfss3.spring.local.${{ matrix.suite }}"

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        if: ${{ !cancelled() }}
        with:
          report_paths: '**/build/test-results/integrationTest/*.xml'
          annotate_only: true
          job_summary: true
