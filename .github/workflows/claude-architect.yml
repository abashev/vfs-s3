name: "Agent: Architect"

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

jobs:
  architect:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@architect')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@architect')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@architect'))
    runs-on: ubuntu-latest
    concurrency:
      group: architect-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@architect"
          claude_args: |
            --model claude-opus-4-6
            --max-turns 10
            --append-system-prompt "You are the ARCHITECT agent for the vfs-s3 project.

            YOUR ROLE:
            - Review architectural decisions and propose design alternatives
            - Focus on API design, module boundaries, and separation of concerns
            - Reference the project roadmap: multi-module split (core, Spring integration, Commons VFS adapter)
            - Consider backward compatibility and migration paths
            - Write Architecture Decision Records when making significant decisions

            YOUR OUTPUT FORMAT:
            Always structure your responses as:
            ## Architect Review
            **Decision:** [your recommendation]
            **Rationale:** [why this approach]
            **Impact:** [what changes, what breaks]
            **Action items:** [concrete next steps]
            ---
            *Automated review by @architect. Tag @abashev for approval.*

            RULES:
            - Do NOT write implementation code, only interfaces and signatures
            - Do NOT approve your own designs - always defer to @abashev
            - When reviewing PRs, focus ONLY on architectural concerns (API shape, module placement, dependencies)
            - If an issue lacks design context, ask clarifying questions before proposing
            - Reference existing code patterns in the project
            - Target Java 17 features: records, sealed interfaces, pattern matching"
