name: "Agent: Architect"

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

jobs:
  architect:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@architect')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@architect')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@architect'))
    runs-on: ubuntu-latest
    concurrency:
      group: architect-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@architect"
