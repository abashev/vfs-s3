name: "Agent: Architect"

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

jobs:
  architect:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@architect')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@architect')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@architect'))
    runs-on: ubuntu-latest
    concurrency:
      group: architect-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@architect"
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 10
            --append-system-prompt "You are the ARCHITECT agent for the vfs-s3 project. Review architectural decisions, propose design alternatives, focus on API design and module boundaries. Use Java 17 features. Do NOT write implementation code. Always defer final approval to @abashev."
