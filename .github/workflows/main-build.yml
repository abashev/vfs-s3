            MinioSuite)       GIST_ID=f259b78ba82183bf7e0c6a452f2a2614 ;;
            CloudServerSuite) GIST_ID=f7194330b0c4fd817c44d4f7d45901e5 ;;
            SeaweedFsSuite)   GIST_ID=24e9575d7a33c12d934401da4a5d8c6f ;;
            MiniStackSuite)   GIST_ID=cb82d1e0a019835c2c564c35a79c2629 ;;
            FlociSuite)       GIST_ID=1e37cb827338e47bb32b30f83dc81a8c ;;
            S3MockSuite)      GIST_ID=3183b7b16ea01b3c898741c23b4569c3 ;;
            GarageSuite)      GIST_ID=f46a1f533f24872a42fa876ba39dd7f8 ;;
