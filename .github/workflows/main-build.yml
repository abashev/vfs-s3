name: Main branch build

on:
  push:
    branches: [ '17.0' ]

permissions:
  checks: write
  contents: read

jobs:
  build:
    name: Compile + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: 17
          distribution: 'liberica'
          cache: 'gradle'

      - name: Build + unit tests + coverage
        run: ./gradlew check jacocoTestReport -x integrationTest

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: ${{ !cancelled() }}
        with:
          report_paths: '**/build/test-results/test/*.xml'
          annotate_only: true
          job_summary: true

      - name: JaCoCo Report by Vilmos
        uses: vilmosnagy/jacoco-report@4982e687fa89217b469696f8633358606c4f3172 # 1.8.0
        if: ${{ !cancelled() }}
        with:
          paths: >-
            ${{ github.workspace }}/modules/commons-vfs/build/reports/jacoco/test/jacocoTestReport.xml,
            ${{ github.workspace }}/modules/jdk/build/reports/jacoco/test/jacocoTestReport.xml,
            ${{ github.workspace }}/modules/spring/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 40
          min-coverage-changed-files: 60
          title: Code Coverage
          comment-type: summary
          update-comment: true

  commons-vfs-local-suites:
    name: commons-vfs local suite — ${{ matrix.suite }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - LocalStackSuite
          - MinioSuite
          - CloudServerSuite
          - SeaweedFsSuite
          - MiniStackSuite
          - FlociSuite
          - S3MockSuite
          - GarageSuite
          - RustFsSuite
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: 17
          distribution: 'liberica'
          cache: 'gradle'

      - name: Run ${{ matrix.suite }}
        run: ./gradlew :modules:commons-vfs:integrationTest --tests "com.github.vfss3.commonsvfs.local.${{ matrix.suite }}"

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: ${{ !cancelled() }}
        with:
          report_paths: '**/build/test-results/integrationTest/*.xml'
          annotate_only: true
          job_summary: true

  jdk-local-suites:
    name: JDK module local suite — ${{ matrix.suite }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - LocalStackSuite
          - MinioSuite
          - CloudServerSuite
          - SeaweedFsSuite
          - MiniStackSuite
          - FlociSuite
          - S3MockSuite
          - GarageSuite
          - RustFsSuite
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          java-version: 17
          distribution: 'liberica'
          cache: 'gradle'

      - name: Run ${{ matrix.suite }}
        run: ./gradlew :modules:jdk:integrationTest --tests "com.github.vfss3.jdk.local.${{ matrix.suite }}"

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: ${{ !cancelled() }}
        with:
          report_paths: '**/build/test-results/integrationTest/*.xml'
          annotate_only: true
          job_summary: true

  commons-vfs-remote-suites:
    name: commons-vfs remote — ${{ matrix.environment }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [ AWS-1, YANDEX-1 ]
    environment: ${{ matrix.environment }}
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: 17
          distribution: 'liberica'
          cache: 'gradle'

      # Deterministic per-commit, per-environment, per-module bucket token (lowercase — S3
      # names must be) shared by the test run and the cleanup step below, so cleanup can target
      # the exact bucket even if the test JVM died before its own @AfterSuite teardown ran. The
      # environment suffix keeps matrix jobs that share a BASE_URL from colliding on one bucket;
      # the module suffix keeps this job's bucket distinct from jdk-remote-suites', which runs
      # against the same environment in parallel.
      - name: Compute bucket token
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: echo "BUCKET_TOKEN=${GITHUB_SHA::12}-${ENVIRONMENT,,}-commonsvfs" >> "$GITHUB_ENV"

      - name: Run EnvironmentBasedSuite against ${{ matrix.environment }}
        id: suite
        run: ./gradlew :modules:commons-vfs:integrationTest --tests "com.github.vfss3.commonsvfs.remote.EnvironmentBasedSuite"

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: ${{ !cancelled() }}
        with:
          report_paths: '**/build/test-results/integrationTest/*.xml'
          annotate_only: true
          job_summary: true

      # Runs regardless of test outcome — deletes the per-commit bucket (BASE_URL +
      # BUCKET_TOKEN) so failed/killed runs don't leak buckets on the remote backend.
      - name: Drop remote test bucket
        if: always()
        run: ./gradlew :modules:commons-vfs:dropRemoteBucket

      # Publish this cell's pass/fail to its OWN shields.io endpoint gist, so the README "Cloud
      # providers" table shows a live per-provider badge. One gist per cell (module × provider)
      # means concurrent matrix jobs never PATCH the same gist — no update races. Gist IDs are
      # public, so they live here in git; only the write token (GIST_SECRET) is secret. Skipped
      # when the token is absent (forks / PRs), so it stays a no-op until configured. Uses the
      # pre-installed gh CLI (no extra pinned action). See the setup note in README.md.
      - name: Update status badge (commons-vfs / ${{ matrix.environment }})
        if: ${{ always() && env.GH_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.GIST_SECRET }}
          OUTCOME: ${{ steps.suite.outcome }}
          # One gist per cell. Replace the placeholders with the real gist IDs (see README).
          GIST_ID: ${{ matrix.environment == 'AWS-1' && 'c8e92c5273b3a71fee46cc9717c48bf2' || '50a0153e062bd2853c43c74df6ee5a5b' }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" = "success" ]; then msg=passing; color=brightgreen; else msg=failing; color=red; fi
          content=$(jq -nc --arg m "$msg" --arg c "$color" '{schemaVersion:1,label:"",message:$m,color:$c}')
          jq -nc --arg content "$content" '{files: {"status.json": {content: $content}}}' \
            | gh api -X PATCH "gists/$GIST_ID" --input - >/dev/null
          echo "Updated gist $GIST_ID (commons-vfs / ${{ matrix.environment }}) -> $msg"

  jdk-remote-suites:
    name: JDK module remote — ${{ matrix.environment }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [ AWS-1, YANDEX-1 ]
    environment: ${{ matrix.environment }}
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          java-version: 17
          distribution: 'liberica'
          cache: 'gradle'

      # See commons-vfs-remote-suites' identical step above — same reasoning, distinct
      # "-jdk" suffix so the two modules' remote suites never collide on one bucket name
      # even though they share the same BASE_URL/environment and run in parallel.
      - name: Compute bucket token
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: echo "BUCKET_TOKEN=${GITHUB_SHA::12}-${ENVIRONMENT,,}-jdk" >> "$GITHUB_ENV"

      - name: Run EnvironmentBasedSuite against ${{ matrix.environment }}
        id: suite
        run: ./gradlew :modules:jdk:integrationTest --tests "com.github.vfss3.jdk.remote.EnvironmentBasedSuite"

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: ${{ !cancelled() }}
        with:
          report_paths: '**/build/test-results/integrationTest/*.xml'
          annotate_only: true
          job_summary: true

      # Runs regardless of test outcome — deletes the per-commit bucket (BASE_URL +
      # BUCKET_TOKEN) so failed/killed runs don't leak buckets on the remote backend.
      - name: Drop remote test bucket
        if: always()
        run: ./gradlew :modules:jdk:dropRemoteBucket

      # See commons-vfs-remote-suites' identical step — one gist per cell, publishes this cell's
      # status to its own gist for the README table's jdk column.
      - name: Update status badge (jdk / ${{ matrix.environment }})
        if: ${{ always() && env.GH_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.GIST_SECRET }}
          OUTCOME: ${{ steps.suite.outcome }}
          # One gist per cell. Replace the placeholders with the real gist IDs (see README).
          GIST_ID: ${{ matrix.environment == 'AWS-1' && 'bb4022ae143839ab84d016c9bc39fd85' || 'cc5795cc9160971453f4aad772ecc508' }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" = "success" ]; then msg=passing; color=brightgreen; else msg=failing; color=red; fi
          content=$(jq -nc --arg m "$msg" --arg c "$color" '{schemaVersion:1,label:"",message:$m,color:$c}')
          jq -nc --arg content "$content" '{files: {"status.json": {content: $content}}}' \
            | gh api -X PATCH "gists/$GIST_ID" --input - >/dev/null
          echo "Updated gist $GIST_ID (jdk / ${{ matrix.environment }}) -> $msg"
