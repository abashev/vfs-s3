name: Main branch build

on:
  push:
    branches: [ '17.0' ]

permissions:
  checks: write
  contents: read

jobs:
  build:
    name: Compile + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: 17
          distribution: 'liberica'
          cache: 'gradle'

      - name: Build + unit tests + coverage
        run: ./gradlew check jacocoTestReport -x integrationTest

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d # v6.4.1
        if: ${{ !cancelled() }}
        with:
          report_paths: '**/build/test-results/test/*.xml'
          annotate_only: true
          job_summary: true

      - name: JaCoCo Report by Vilmos
        uses: vilmosnagy/jacoco-report@4982e687fa89217b469696f8633358606c4f3172 # 1.8.0
        if: ${{ !cancelled() }}
        with:
          paths: >-
            ${{ github.workspace }}/modules/commons-vfs/build/reports/jacoco/test/jacocoTestReport.xml,
            ${{ github.workspace }}/modules/jdk/build/reports/jacoco/test/jacocoTestReport.xml,
            ${{ github.workspace }}/modules/spring-6/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 40
          min-coverage-changed-files: 60
          title: Code Coverage
          comment-type: summary
          update-comment: true

  local-suites:
    name: Local suite — ${{ matrix.suite }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - LocalStackSuite
          - MinioSuite
          - CloudServerSuite
          - SeaweedFsSuite
          - MiniStackSuite
          - FlociSuite
          - S3MockSuite
          - GarageSuite
          - RustFsSuite
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: 17
          distribution: 'liberica'
          cache: 'gradle'

      - name: Run ${{ matrix.suite }}
        run: ./gradlew :modules:commons-vfs:integrationTest --tests "com.github.vfss3.commonsvfs.local.${{ matrix.suite }}"

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d # v6.4.1
        if: ${{ !cancelled() }}
        with:
          report_paths: '**/build/test-results/integrationTest/*.xml'
          annotate_only: true
          job_summary: true

  remote-suites:
    name: Remote — ${{ matrix.environment }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [ AWS-1, YANDEX-1, YANDEX-2 ]
    environment: ${{ matrix.environment }}
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: 17
          distribution: 'liberica'
          cache: 'gradle'

      - name: Run EnvironmentBasedSuite against ${{ matrix.environment }}
        run: ./gradlew :modules:commons-vfs:integrationTest --tests "com.github.vfss3.commonsvfs.remote.EnvironmentBasedSuite"

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d # v6.4.1
        if: ${{ !cancelled() }}
        with:
          report_paths: '**/build/test-results/integrationTest/*.xml'
          annotate_only: true
          job_summary: true
