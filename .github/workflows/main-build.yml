name: Main branch build

on:
  push:
    branches: [ '17.0' ]

permissions:
  checks: write
  contents: read

jobs:
  build:
    name: Compile + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 17
          distribution: 'liberica'
          cache: 'gradle'

      - name: Build + unit tests + coverage
        run: ./gradlew check jacocoTestReport -x integrationTest

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: ${{ !cancelled() }}
        with:
          report_paths: '**/build/test-results/test/*.xml'
          annotate_only: true
          job_summary: true

      - name: JaCoCo Report by Vilmos
        uses: vilmosnagy/jacoco-report@4982e687fa89217b469696f8633358606c4f3172 # 1.8.0
        if: ${{ !cancelled() }}
        with:
          paths: >-
            ${{ github.workspace }}/modules/commons-vfs/build/reports/jacoco/test/jacocoTestReport.xml,
            ${{ github.workspace }}/modules/jdk/build/reports/jacoco/test/jacocoTestReport.xml,
            ${{ github.workspace }}/modules/spring/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 40
          min-coverage-changed-files: 60
          title: Code Coverage
          comment-type: summary
          update-comment: true

  commons-vfs-local-suites:
    name: commons-vfs local suite — ${{ matrix.suite }}
    needs: build
    runs-on: ubuntu-latest
    # See commons-vfs-remote-suites — serialized per module × suite so back-to-back runs
    # update this cell's status-badge gist in commit order.
    concurrency:
      group: local-commonsvfs-${{ matrix.suite }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        suite:
          - LocalStackSuite
          - MinioSuite
          - CloudServerSuite
          - SeaweedFsSuite
          - MiniStackSuite
          - FlociSuite
          - S3MockSuite
          - GarageSuite
          - RustFsSuite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 17
          distribution: 'liberica'
          cache: 'gradle'

      - name: Run ${{ matrix.suite }}
        id: suite
        run: ./gradlew :modules:commons-vfs:integrationTest --tests "com.github.vfss3.commonsvfs.local.${{ matrix.suite }}"

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: ${{ !cancelled() }}
        with:
          report_paths: '**/build/test-results/integrationTest/*.xml'
          annotate_only: true
          job_summary: true

      # See commons-vfs-remote-suites' identical step — one gist per cell (module × emulator),
      # publishes this cell's status to its own gist for the README "Local emulators" table.
      - name: Update status badge (commons-vfs / ${{ matrix.suite }})
        if: ${{ !cancelled() && env.GH_TOKEN != '' && (steps.suite.outcome == 'success' || steps.suite.outcome == 'failure') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GIST_SECRET }}
          OUTCOME: ${{ steps.suite.outcome }}
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          case "$SUITE" in
            LocalStackSuite)  GIST_ID=b4b0eaf73f6efc7d4f6f00430acb113c ;;
            MinioSuite)       GIST_ID=515d7a1f7c705dcb4bdb94ed2bc3d3fb ;;
            CloudServerSuite) GIST_ID=da9fc57b268821a47cb4c47585429682 ;;
            SeaweedFsSuite)   GIST_ID=e8f1b6ee501823c0c054a2b488e914de ;;
            MiniStackSuite)   GIST_ID=02ddb7d6113f08bb47756e1f912ceb75 ;;
            FlociSuite)       GIST_ID=aeb19af30275b1f5fc1d1e97d28b4eb6 ;;
            S3MockSuite)      GIST_ID=d0600d6bb8c5af06ed82cec023dd4f28 ;;
            GarageSuite)      GIST_ID=acf0cdd3085b634070007b65ca877e62 ;;
            RustFsSuite)      GIST_ID=fa59ec4a46dc16a438ec63c76f2ad731 ;;
            *) echo "::notice::No badge gist configured for $SUITE — skipping"; exit 0 ;;
          esac
          if [ "$OUTCOME" = "success" ]; then msg=passing; color=brightgreen; else msg=failing; color=red; fi
          content=$(jq -nc --arg m "$msg" --arg c "$color" '{schemaVersion:1,label:"",message:$m,color:$c}')
          jq -nc --arg content "$content" '{files: {"status.json": {content: $content}}}' \
            | gh api -X PATCH "gists/$GIST_ID" --input - >/dev/null
          echo "Updated gist $GIST_ID (commons-vfs / ${{ matrix.suite }}) -> $msg"

