            CloudServerSuite) GIST_ID=d4d4ad377a4b5b2953a6c13772dcf461 ;;
            SeaweedFsSuite)   GIST_ID=1fe06162635daf3bc1eb41101aa81c4a ;;
            MiniStackSuite)   GIST_ID=46294de3336be9decc8cd01265f8b34d ;;
            FlociSuite)       GIST_ID=84544a5f0cb2783c356548a0bc693c2f ;;
            S3MockSuite)      GIST_ID=0b7616cc952f817d5679dc23171f3a1a ;;
