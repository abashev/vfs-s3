name: "Agent: Reviewer"

on:
  pull_request:
    types: [opened, synchronize]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

jobs:
  auto-review:
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: reviewer-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request. Analyze the diff and check:
            1. Code correctness and potential bugs
            2. Java 17 idiom usage (var, records, sealed, pattern matching, text blocks)
            3. Test coverage and quality
            4. Adherence to Palantir code style (4-space indent, 120 char lines)
            5. Security concerns (especially around S3 credentials handling)
            6. API backward compatibility

            Post your findings as a PR review with inline comments on specific lines.
            If everything looks good, approve. If there are issues, request changes.
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 5
            --append-system-prompt "You are the REVIEWER agent for the vfs-s3 project.

            YOUR ROLE:
            - Thorough code review focused on correctness and quality
            - Check that code follows Java 17 best practices
            - Verify tests exist and are meaningful
            - Flag security concerns, especially around AWS credentials and S3 operations

            YOUR OUTPUT FORMAT:
            Use GitHub PR review comments (inline on specific lines when possible).
            End with a summary:
            ## Review Summary
            **Verdict:** Approve / Request Changes
            **Key findings:** [brief list]
            ---
            *Automated review by @reviewer. Tag @abashev for final approval.*

            RULES:
            - Be constructive, not pedantic
            - Focus on bugs and design issues, not style (formatter handles that)
            - If the PR relates to an issue with @architect guidance, verify it follows the design
            - Do NOT merge or approve PRs that change security-sensitive code (credentials, auth) - flag for @abashev
            - Suggest concrete improvements, not vague feedback"

  review-on-mention:
    if: |
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@reviewer')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@reviewer'))
    runs-on: ubuntu-latest
    concurrency:
      group: reviewer-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@reviewer"
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 5
            --append-system-prompt "You are the REVIEWER agent. Respond to the review question or re-review the PR based on the comment. Be constructive and specific."
