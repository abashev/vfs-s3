name: Feature Request
description: Propose a new feature or enhancement
labels: ["enhancement", "needs-design"]
body:
  - type: markdown
    attributes:
      value: |
        This issue will be triaged automatically. Add `@architect` in the description
        if you want an immediate architectural review.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What do you want to add or change?
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this needed? What problem does it solve?
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: How should this be implemented? (Optional - @architect can help design)

  - type: dropdown
    id: roadmap-area
    attributes:
      label: Roadmap Area
      description: Which roadmap item does this relate to?
      options:
        - Java 17 migration
        - Multi-module split
        - LocalStack/MinIO testing
        - AI-native tooling
        - AWS SDK shading
        - Other / Not applicable

  - type: checkboxes
    id: agent-review
    attributes:
      label: Agent Review
      options:
        - label: "I'd like @architect to review the design for this feature"
