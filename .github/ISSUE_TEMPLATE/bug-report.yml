name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps or code to reproduce the issue
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Which version of vfs-s3 are you using?
      placeholder: "e.g., 4.4.0"

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Java version, S3 provider (AWS, MinIO, etc.), OS

  - type: checkboxes
    id: agent-fix
    attributes:
      label: Agent Fix
      options:
        - label: "This bug has clear reproduction steps - @developer can try to fix it"
