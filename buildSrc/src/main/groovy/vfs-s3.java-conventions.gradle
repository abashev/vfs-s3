plugins {
    id 'java-library'
    id 'jacoco'
    id 'com.diffplug.spotless'
    id 'net.ltgt.errorprone'
    id 'net.ltgt.nullaway'
    id 'io.freefair.lombok'
}

group = 'com.github.abashev'

repositories {
    mavenCentral()
}

// JVM Test Suites (Gradle 7.3+) — declarative test source sets that auto-wire
// source folders, dependencies, configurations, and Test tasks. `implementation
// project()` brings the main source set's classes onto the suite's classpath, so
// no explicit `compileClasspath +=` plumbing is needed.
testing {
    suites {
        test {
            useJUnitJupiter()
        }
        integrationTest(JvmTestSuite) {
            useJUnitJupiter()
            dependencies {
                implementation project()
            }
            targets {
                all {
                    testTask.configure {
                        shouldRunAfter test
                    }
                }
            }
        }
    }
}

// Share unit-test dependencies (logback, assertj, commons-io, …) with integration
// tests. Integration-only deps (testcontainers, junit-platform-suite) are added
// via `integrationTestImplementation` directly in the module's build.gradle.
configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// JaCoCo — aggregate coverage from both unit and integration tests
jacocoTestReport {
    dependsOn test, integrationTest

    // Include execution data from both test runs
    executionData fileTree(layout.buildDirectory).include("jacoco/*.exec")

    reports {
        xml.required = true
        html.required = false
    }
}

// Spotless
spotless {
    java {
        palantirJavaFormat('2.89.0')
        target 'src/*/java/**/*.java'
    }
}

// Error Prone + NullAway
dependencies {
    errorprone libs.errorprone.core
    errorprone libs.nullaway
    // Picnic's error-prone-support: extra bug checkers on top of stock Error Prone. We only use
    // it for StaticImport today (promoted to an error below) — it flags qualified calls to
    // commonly-static-imported JDK/JUnit members (Objects.requireNonNull, Comparator.reverseOrder,
    // StandardCharsets.UTF_8, …) more precisely and more broadly than a hand-rolled Checkstyle
    // regex ever could, since it works on the AST. The version pinned in the catalog must stay
    // compatible with our errorprone version (2.42.0) per
    // https://error-prone.picnic.tech/compatibility/ — bump both together.
    errorprone libs.error.prone.support.contrib
}

nullaway {
    annotatedPackages.add('com.github.vfss3')
}

tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        error('StaticImport')
    }
}
