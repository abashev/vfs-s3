plugins {
    id 'java-library'
    id 'jacoco'
    id 'com.diffplug.spotless'
    id 'net.ltgt.errorprone'
    id 'net.ltgt.nullaway'
    id 'io.freefair.lombok'
    id 'pmd'
}

group = 'com.github.abashev'

repositories {
    mavenCentral()
}

// JVM Test Suites (Gradle 7.3+) — declarative test source sets that auto-wire
// source folders, dependencies, configurations, and Test tasks. `implementation
// project()` brings the main source set's classes onto the suite's classpath, so
// no explicit `compileClasspath +=` plumbing is needed.
testing {
    suites {
        test {
            useJUnitJupiter()
        }
        integrationTest(JvmTestSuite) {
            useJUnitJupiter()
            dependencies {
                implementation project()
            }
            targets {
                all {
                    testTask.configure {
                        shouldRunAfter test
                    }
                }
            }
        }
    }
}

// Share unit-test dependencies (logback, assertj, commons-io, …) with integration
// tests. Integration-only deps (testcontainers, junit-platform-suite) are added
// via `integrationTestImplementation` directly in the module's build.gradle.
configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// JaCoCo — aggregate coverage from both unit and integration tests
jacocoTestReport {
    dependsOn test, integrationTest

    // Include execution data from both test runs
    executionData fileTree(layout.buildDirectory).include("jacoco/*.exec")

    reports {
        xml.required = true
        html.required = false
    }
}

// Spotless
spotless {
    java {
        palantirJavaFormat('2.96.0')
        target 'src/*/java/**/*.java'
    }
}

// Error Prone + NullAway
dependencies {
    errorprone libs.errorprone.core
    errorprone libs.nullaway
    errorprone libs.error.prone.support.contrib
}

nullaway {
    annotatedPackages.add('com.github.vfss3')
}

// Promote two "prefer imports over qualified names" checks to build-breaking errors:
//   - StaticImport (Picnic)       — qualified calls to commonly static-imported members
//                                   (Objects.requireNonNull, StandardCharsets.UTF_8, …).
//   - UnnecessarilyFullyQualified — a fully-qualified type that could simply be imported without
//                                   conflict (e.g. java.nio.file.StandardCopyOption → import it).
// PMD's UnnecessaryFullyQualifiedName (below) is the complement, not a duplicate.
tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        error('StaticImport')
        error('UnnecessarilyFullyQualified')
        error('EmptyBlockTag')
        error('OperatorPrecedence')
        error('RedundantStringConversion')
        error('PatternMatchingInstanceof')
        error('UnnecessaryParentheses')
    }
}

// PMD — one rule only: UnnecessaryFullyQualifiedName. Complements the Error Prone checks above by
// flagging a qualifier that is redundant because the simple name is ALREADY imported — including a
// static wildcard import, which Error Prone does not flag (e.g. `FileType.IMAGINARY` reduced to
// `IMAGINARY` given `import static …FileType.*`). The single rule is referenced inline (PMD resolves
// `<ruleset-path>/<RuleName>`), so no external ruleset file is needed; this also overrides PMD's
// default rulesets, leaving only this rule active. Creates a pmd<SourceSet> task per source set
// (pmdMain / pmdTest / pmdIntegrationTest), all wired into `check`; fails the build on any violation.
pmd {
    toolVersion = libs.versions.pmd.get()
    ruleSets = [
            'category/java/codestyle.xml/UnnecessaryFullyQualifiedName'
    ]
}
