plugins {
    id 'java-library'
    id 'jacoco'
    id 'checkstyle'
    id 'com.diffplug.spotless'
    id 'net.ltgt.errorprone'
    id 'net.ltgt.nullaway'
    id 'io.freefair.lombok'
}

group = 'com.github.abashev'

repositories {
    mavenCentral()
}

// JVM Test Suites (Gradle 7.3+) — declarative test source sets that auto-wire
// source folders, dependencies, configurations, and Test tasks. `implementation
// project()` brings the main source set's classes onto the suite's classpath, so
// no explicit `compileClasspath +=` plumbing is needed.
testing {
    suites {
        test {
            useJUnitJupiter()
        }
        integrationTest(JvmTestSuite) {
            useJUnitJupiter()
            dependencies {
                implementation project()
            }
            targets {
                all {
                    testTask.configure {
                        shouldRunAfter test
                    }
                }
            }
        }
    }
}

// Share unit-test dependencies (logback, assertj, commons-io, …) with integration
// tests. Integration-only deps (testcontainers, junit-platform-suite) are added
// via `integrationTestImplementation` directly in the module's build.gradle.
configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// JaCoCo — aggregate coverage from both unit and integration tests
jacocoTestReport {
    dependsOn test, integrationTest

    // Include execution data from both test runs
    executionData fileTree(layout.buildDirectory).include("jacoco/*.exec")

    reports {
        xml.required = true
        html.required = false
    }
}

// Spotless
spotless {
    java {
        palantirJavaFormat('2.89.0')
        target 'src/*/java/**/*.java'
    }
}

// Error Prone + NullAway
dependencies {
    errorprone libs.errorprone.core
    errorprone libs.nullaway
}

nullaway {
    annotatedPackages.add('com.github.vfss3')
}

// Checkstyle — guardrails for patterns Error Prone/NullAway don't check for (see
// config/checkstyle/checkstyle.xml). Runs as part of `check`, same as the other verifiers here.
checkstyle {
    toolVersion = libs.versions.checkstyle.get()
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
}
