plugins {
    id 'vfs-s3.java-conventions'
    id 'vfs-s3.publishing-conventions'
}

description = 'Amazon S3 Spring Resource / ResourceLoader implementation'

dependencies {
    // Spring is provided by the user's application — compileOnly scope
    compileOnly libs.spring.core
    compileOnly libs.spring.context

    // The AWS SDK is this module's own backend (S3Client / AwsCredentialsProvider appear in
    // the public API), so it is a real `api` dependency — same treatment as jdk/commons-vfs.
    api libs.aws.sdk.s3

    testImplementation libs.junit.jupiter
    testImplementation libs.spring.core
    testImplementation libs.spring.context
    testImplementation libs.junit.platform.suite
    testImplementation libs.testcontainers.core
    testImplementation libs.testcontainers.localstack
    testImplementation libs.testcontainers.junit.jupiter
}

// Published under a distinct, namespaced Maven coordinate (`vfs-spring`) while the Gradle module /
// folder / package stay `:modules:spring` / `com.github.vfss3.spring`. Only the artifactId changes.
base {
    archivesName = 'vfs-spring'
}
publishing.publications.mavenJava {
    artifactId = 'vfs-spring'
    pom.name.set("${project.group}:vfs-spring")
}

// Integration tests are organised as a set of @Suite classes under
// com.github.vfss3.spring.{local,remote} — one per backend, plus a remote suite that targets a
// real AWS/Yandex bucket configured through environment variables. Each local suite starts its
// own container in @BeforeSuite and runs the shared *Test classes in com.github.vfss3.spring.tests
// against it. See modules/commons-vfs/build.gradle for the same pattern in more detail.
tasks.named('integrationTest', Test) {
    useJUnitPlatform { includeEngines 'junit-platform-suite' }
    if (!providers.environmentVariable('BASE_URL').isPresent()) {
        exclude '**/remote/EnvironmentBasedSuite.class'
    }
}

// Standalone cleanup for the remote integration bucket — see
// modules/commons-vfs/build.gradle's dropRemoteBucket task for the rationale (CI runs this in
// an `if: always()` step so a failed/killed test JVM can't leak the bucket).
//
//   BASE_URL=… BUCKET_TOKEN=… AWS_ACCESS_KEY_ID=… AWS_SECRET_KEY=… \
//     ./gradlew :modules:spring:dropRemoteBucket
tasks.register('dropRemoteBucket', JavaExec) {
    group = 'verification'
    description = 'Delete the remote S3 test bucket named by BASE_URL + BUCKET_TOKEN.'
    classpath = sourceSets.integrationTest.runtimeClasspath
    mainClass = 'com.github.vfss3.spring.remote.RemoteBucketCleaner'
}
