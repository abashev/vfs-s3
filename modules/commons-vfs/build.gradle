plugins {
    id 'vfs-s3.java-conventions'

    id 'maven-publish'
    id 'signing'
}

description = 'Amazon S3 driver for VFS (Apache Commons Virtual File System)'

dependencies {
    api libs.commons.vfs2
    api libs.aws.sdk.s3

    testImplementation libs.junit.jupiter
    testImplementation libs.junit.platform.suite
    testImplementation libs.commons.io
    testImplementation libs.commons.httpclient
    testImplementation libs.logback.classic
    testImplementation libs.jcl.over.slf4j
    testImplementation libs.assertj.core
    testImplementation libs.testcontainers.core
    testImplementation libs.testcontainers.localstack
    testImplementation libs.testcontainers.junit.jupiter
}

// Integration tests are organised as a set of @Suite classes (LocalStackTestSuite,
// MinioTestSuite, …) — each starts its own container in @BeforeSuite, then runs the
// shared *Test classes in com.github.vfss3.commonsvfs.tests. Restrict top-level
// discovery to the suite engine so the test classes aren't picked up directly by
// junit-jupiter (without a container) on top of running inside each suite — see
// https://junit.org/junit5/docs/current/user-guide/#junit-platform-suite-engine
tasks.named('integrationTest', Test) {
    useJUnitPlatform {
        includeEngines 'junit-platform-suite'
    }
}

// Maven publishing
java {
    withSourcesJar()
    withJavadocJar()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = "${project.group}:${project.name}"
                description = project.description
                url = 'https://github.com/abashev/vfs-s3'
                licenses {
                    license {
                        name = 'The Apache Software License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        name = 'Alexey Abashev'
                        email = 'alexey@abashev.ru'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/abashev/vfs-s3.git'
                    developerConnection = 'scm:git:ssh://github.com:abashev/vfs-s3.git'
                    url = 'https://github.com/abashev/vfs-s3'
                }
            }
        }
    }
}

signing {
    sign publishing.publications.mavenJava
}
