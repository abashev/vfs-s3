plugins {
    id 'vfs-s3.java-conventions'
    id 'vfs-s3.publishing-conventions'
}

description = 'Amazon S3 Spring 7 Resource / ResourceLoader implementation'

dependencies {
    // Spring is provided by the user's application — compileOnly scope
    compileOnly libs.spring7.core
    compileOnly libs.spring7.context

    testImplementation libs.junit.jupiter
    testImplementation libs.spring7.core
    testImplementation libs.spring7.context
}
